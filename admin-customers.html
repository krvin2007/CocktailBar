<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0907">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<title>Khách hàng thành viên — Quán Bar Đêm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="admin-layout">
  <aside id="admin-sidebar"></aside>

  <div class="admin-main">
    <button type="button" class="admin-sidebar-toggle" id="admin-sidebar-toggle" aria-label="Mở menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div id="admin-topbar"></div>

    <div class="table-wrap">
      <div class="table-toolbar">
        <div class="filters">
          <div class="search-input-wrap">
            <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="f-keyword" placeholder="Tìm theo tên, SĐT, email...">
          </div>
          <select id="f-rank">
            <option value="all">Tất cả hạng</option>
          </select>
          <select id="f-sort">
            <option value="points-desc">Điểm cao nhất</option>
            <option value="spent-desc">Chi tiêu nhiều nhất</option>
            <option value="newest">Mới đăng ký</option>
            <option value="name-asc">Tên A → Z</option>
          </select>
        </div>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Khách hàng</th>
            <th>Liên hệ</th>
            <th>Hạng</th>
            <th>Điểm</th>
            <th>Đơn hoàn tất</th>
            <th>Tổng chi tiêu</th>
            <th>Trạng thái 18+</th>
            <th style="text-align: right;">Thao tác</th>
          </tr>
        </thead>
        <tbody id="customers-body"></tbody>
      </table>

      <div class="table-pagination" id="pagination"></div>
    </div>
  </div>
</div>

<!-- ---------- Modal lịch sử điểm ---------- -->
<div class="modal-overlay" id="customer-modal" hidden>
  <div class="modal-box modal-wide">
    <div class="modal-head">
      <h3 id="customer-modal-title">Lịch sử điểm</h3>
      <button type="button" class="modal-close-x" id="customer-modal-close" aria-label="Đóng">&times;</button>
    </div>
    <div class="modal-body" id="customer-modal-body"></div>
  </div>
</div>

<!-- ---------- Modal thiết lập chiết khấu ưu đãi riêng cho khách ---------- -->
<div class="modal-overlay" id="discount-modal" hidden>
  <div class="modal-box" style="max-width: 520px;">
    <div class="modal-head">
      <div>
        <h3 id="discount-modal-title" style="margin: 0; display: flex; align-items: center; gap: 8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" style="color: var(--amber-soft);"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
          Chiết Khấu Ưu Đãi Riêng Cho Khách Hàng
        </h3>
        <p class="text-xs text-muted" id="discount-modal-subtitle" style="margin: 4px 0 0 0;"></p>
      </div>
      <button type="button" class="modal-close-x" id="discount-modal-close" aria-label="Đóng">&times;</button>
    </div>

    <form id="discount-form" novalidate style="padding-top: 12px;">
      <input type="hidden" name="customerId" id="discount-form-id">

      <div class="form-group mb-3">
        <label>Tỷ lệ giảm giá ưu đãi riêng (%) <span class="req">*</span></label>
        <div style="display: flex; align-items: center; gap: 8px;">
          <input type="number" name="customDiscount" id="discount-form-percent" min="0" max="50" step="1" placeholder="VD: 10" style="font-size: 1.1rem; font-weight: 600; width: 120px;" required>
          <span style="font-weight: 700; color: var(--amber-soft); font-size: 1.1rem;">%</span>
          <span class="text-xs text-muted">(Nhập 0 nếu huỷ giảm giá riêng, đưa về theo hạng)</span>
        </div>
        <small class="text-xs text-muted" style="display: block; margin-top: 4px;">
          Khi được thiết lập, khách hàng đặt thêm bất kỳ món nào giá cũng tự động giảm theo tỷ lệ này.
        </small>
      </div>

      <div class="form-group mb-3">
        <label>Ghi chú lý do ưu đãi</label>
        <input type="text" name="discountNote" id="discount-form-note" placeholder="VD: Khách quen VIP, Sinh nhật đặc biệt, Đối tác quán...">
      </div>

      <div class="form-actions" style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
        <button type="button" class="btn btn-ghost" id="discount-modal-cancel">Đóng</button>
        <div style="display: flex; gap: 8px;">
          <button type="button" class="btn btn-ghost" id="discount-btn-clear" title="Huỷ ưu đãi riêng, đưa về theo hạng">Xoá ưu đãi</button>
          <button type="submit" class="btn btn-primary" id="discount-form-submit">Lưu chiết khấu</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- axios (CDN) theo hướng dẫn bài giảng; không tải được thì js/modules/api.js tự dùng fetch() -->
<script src="https://cdn.jsdelivr.net/npm/axios@1/dist/axios.min.js"></script>
<script type="module" src="js/pages/admin-customers.js"></script>
</body>
</html>
