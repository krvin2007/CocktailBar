<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tổng quan Vận hành — Quán Bar Đêm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="admin-layout">
  <aside id="admin-sidebar"></aside>

  <div class="admin-main">
    <button type="button" class="admin-sidebar-toggle" id="admin-sidebar-toggle" aria-label="Mở menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div id="admin-topbar"></div>

    <!-- Thẻ thống kê KPI -->
    <div class="stat-cards" id="stat-cards"></div>

    <div class="dashboard-grid">
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <h3>Doanh thu 7 ngày gần nhất</h3>
          </div>
          <span class="panel-badge">Chỉ tính đơn hoàn tất</span>
        </div>
        <div class="bar-chart" id="revenue-chart"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="panel-title-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
            <h3>Top thức uống bán chạy</h3>
          </div>
          <span class="panel-badge">Xếp theo số ly</span>
        </div>
        <div class="rank-list" id="top-drinks"></div>
      </div>
    </div>

    <!-- Chương trình giá đang chạy: sale theo món + món mới tự giảm (js/pages/admin-dashboard.js) -->
    <div class="panel mt-2">
      <div class="panel-head">
        <div class="panel-title-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          <h3>Món đang có giá ưu đãi</h3>
          <span class="panel-badge" id="promo-drinks-count">0 món</span>
        </div>
        <a href="admin-menu.html" class="panel-link">Chỉnh mức sale →</a>
      </div>

      <div class="table-wrap" style="border:none;">
        <table class="data-table">
          <thead>
            <tr>
              <th>Đồ uống</th>
              <th>Chương trình</th>
              <th>Giá gốc</th>
              <th>Giá bán</th>
              <th>Tiết kiệm / ly</th>
            </tr>
          </thead>
          <tbody id="promo-drinks-body"></tbody>
        </table>
      </div>
    </div>

    <div class="panel mt-2">
      <div class="panel-head">
        <div class="panel-title-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/></svg>
          <h3>Đơn đặt bàn &amp; gọi món gần đây</h3>
        </div>
        <a href="admin-orders.html" class="panel-link">Xem toàn bộ đơn →</a>
      </div>

      <div class="table-wrap" style="border:none;">
        <table class="data-table">
          <thead>
            <tr>
              <th>Mã đơn</th>
              <th>Khách hàng</th>
              <th>Hình thức</th>
              <th>Tổng tiền</th>
              <th>Trạng thái</th>
              <th>Thời gian</th>
            </tr>
          </thead>
          <tbody id="recent-orders-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- axios (CDN) theo hướng dẫn bài giảng; không tải được thì js/modules/api.js tự dùng fetch() -->
<script src="https://cdn.jsdelivr.net/npm/axios@1/dist/axios.min.js"></script>
<script type="module" src="js/pages/admin-dashboard.js"></script>
</body>
</html>
