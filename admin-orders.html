<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0907">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<title>Quản lý đơn hàng &amp; Đặt bàn — Quán Bar Đêm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="admin-layout">
  <aside id="admin-sidebar"></aside>

  <div class="admin-main">
    <button type="button" class="admin-sidebar-toggle" id="admin-sidebar-toggle" aria-label="Mở menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div id="admin-topbar"></div>

    <div class="table-wrap">
      <div class="table-toolbar">
        <div class="filters">
          <div class="search-input-wrap">
            <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="f-keyword" placeholder="Tìm theo mã đơn, tên, SĐT...">
          </div>
          <select id="f-status">
            <option value="all">Tất cả trạng thái</option>
            <option value="pending">Chờ xử lý</option>
            <option value="preparing">Đang pha chế</option>
            <option value="completed">Đã phục vụ xong</option>
            <option value="cancelled">Đã huỷ</option>
          </select>
          <select id="f-payment">
            <option value="all">Mọi tình trạng thanh toán</option>
            <option value="unpaid">Chưa thanh toán</option>
            <option value="awaiting">Chờ xác nhận chuyển khoản</option>
            <option value="paid">Đã thanh toán</option>
          </select>
          <select id="f-sort">
            <option value="newest">Thời gian: Mới nhất</option>
            <option value="oldest">Thời gian: Cũ nhất</option>
            <option value="total-desc">Giá trị: Cao nhất</option>
            <option value="total-asc">Giá trị: Thấp nhất</option>
          </select>
        </div>
        <!-- Chỉ Quản lý thấy nút này (quyền settings:bank) -->
        <button type="button" class="btn btn-outline" id="bank-settings-btn" hidden>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
          <span>Tài khoản nhận tiền</span>
        </button>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Mã đơn</th>
            <th>Khách hàng</th>
            <th>SĐT</th>
            <th>Hình thức</th>
            <th>Tổng tiền</th>
            <th>Trạng thái</th>
            <th>Thanh toán</th>
            <th>Đối chiếu CCCD</th>
            <th>Thời gian</th>
            <th style="text-align: right;">Thao tác</th>
          </tr>
        </thead>
        <tbody id="orders-body"></tbody>
      </table>

      <div class="table-pagination" id="pagination"></div>
    </div>
  </div>
</div>

<!-- ---------- Modal chi tiết đơn hàng ---------- -->
<div class="modal-overlay" id="order-modal" hidden>
  <div class="modal-box modal-wide">
    <div class="modal-head">
      <h3 id="order-modal-title">Chi tiết đơn hàng</h3>
      <button type="button" class="modal-close-x" id="order-modal-close" aria-label="Đóng">&times;</button>
    </div>

    <div id="order-modal-body" class="order-detail-content"></div>

    <div class="order-modal-footer">
      <div class="order-status-control">
        <label for="order-status-select">Cập nhật tiến độ:</label>
        <select id="order-status-select">
          <option value="pending">Chờ xử lý</option>
          <option value="preparing">Đang pha chế</option>
          <option value="completed">Đã hoàn tất phục vụ</option>
          <option value="cancelled">Huỷ đơn hàng</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-outline btn-sm" id="order-vietqr-btn" title="Hiện mã VietQR thanh toán cho khách quét">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Mã VietQR
        </button>
        <button type="button" class="btn btn-outline btn-sm" id="order-paid-btn" hidden title="Thu ngân đã nhận đủ tiền (tiền mặt hoặc chuyển khoản)">
          Xác nhận đã thu tiền
        </button>
        <button type="button" class="btn btn-danger btn-sm" id="order-delete-btn">Xoá đơn</button>
        <button type="button" class="btn btn-primary btn-sm" id="order-save-status-btn">Lưu trạng thái</button>
      </div>
    </div>
  </div>
</div>

<!-- ---------- Modal tài khoản ngân hàng nhận tiền (chỉ Quản lý) ---------- -->
<div class="modal-overlay" id="bank-modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h3>Tài khoản nhận tiền chuyển khoản</h3>
      <button type="button" class="modal-close-x" id="bank-modal-close" aria-label="Đóng">&times;</button>
    </div>
    <form id="bank-form" novalidate>
      <div class="form-group">
        <label>Ngân hàng <span class="req">*</span></label>
        <select name="bankId" data-rule="required" id="bank-form-bank"></select>
      </div>
      <div class="form-group">
        <label>Số tài khoản <span class="req">*</span></label>
        <input type="text" name="accountNumber" data-rule="required|integer|min:6|max:19" inputmode="numeric" placeholder="VD: 0901234567">
      </div>
      <div class="form-group">
        <label>Tên chủ tài khoản <span class="req">*</span></label>
        <input type="text" name="accountName" data-rule="required|min:2|max:50" placeholder="VD: QUAN BAR DEM">
        <small class="text-xs text-muted" style="display:block; margin-top: 4px;">Tự chuyển thành chữ IN HOA không dấu như trên app ngân hàng.</small>
      </div>
      <p class="text-xs text-muted">Mã QR của mọi đơn hàng (cả trang khách) sẽ dùng tài khoản này.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="bank-form-cancel">Huỷ</button>
        <button type="submit" class="btn btn-primary" id="bank-form-submit">Lưu tài khoản</button>
      </div>
    </form>
  </div>
</div>

<!-- axios (CDN) theo hướng dẫn bài giảng; không tải được thì js/modules/api.js tự dùng fetch() -->
<script src="https://cdn.jsdelivr.net/npm/axios@1/dist/axios.min.js"></script>
<script type="module" src="js/pages/admin-orders.js"></script>
</body>
</html>
